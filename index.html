<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f7040">
<title>นัดหมาย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --green:#18a15a; --green-dark:#0f7040; --green-light:#2dcc77;
  --green-soft:rgba(24,161,90,.10); --green-softer:rgba(24,161,90,.05);
  --bg:#f0f7f3; --card:#fff;
  --text:#1a2e25; --text-2:#3d5449; --muted:#7a9e8e;
  --border:rgba(24,161,90,.18); --radius:16px; --radius-sm:11px; --radius-xs:8px;
  --shadow:0 4px 20px rgba(24,161,90,.10),0 1px 4px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(24,161,90,.16),0 2px 8px rgba(0,0,0,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:'Prompt',sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;overscroll-behavior:none;}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 60%,var(--green-light) 100%);
  padding:env(safe-area-inset-top) 0 0;
  box-shadow:0 2px 16px rgba(15,112,64,.35);
}
.topbar-inner{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar-title{display:flex;align-items:center;gap:10px;}
.topbar-icon{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;flex-shrink:0;}
.topbar-text h1{font-size:1rem;font-weight:700;color:#fff;margin:0;line-height:1.2;}
.topbar-text small{font-size:.68rem;color:rgba(255,255,255,.8);display:block;margin-top:1px;}
.topbar-refresh{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.3);color:#fff;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
.topbar-refresh:active{background:rgba(255,255,255,.35);transform:scale(.92);}
.topbar-refresh.spinning i{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── SEARCH & FILTER ── */
.search-wrap{padding:12px 16px 0;}
.search-box{position:relative;}
.search-box input{
  width:100%;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 14px 11px 40px;font-family:'Prompt',sans-serif;font-size:.88rem;
  color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
  box-shadow:var(--shadow);}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(24,161,90,.12);}
.search-box i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;}
.search-box .clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.8rem;cursor:pointer;padding:4px;display:none;}

/* ── DATE RANGE BUTTONS ── */
.range-wrap{padding:0 16px 10px;display:flex;gap:7px;}
.range-btn{flex:1;padding:8px 4px;border-radius:var(--radius-xs);font-family:'Prompt',sans-serif;
  font-size:.76rem;font-weight:600;border:1.5px solid var(--border);
  background:#fff;color:var(--muted);cursor:pointer;transition:all .18s;text-align:center;}
.range-btn.active{background:linear-gradient(135deg,var(--green-dark),var(--green));
  border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(24,161,90,.3);}
.range-btn:active{transform:scale(.95);}

/* ── FILTER CHIPS ── */
.filter-wrap{padding:10px 16px 12px;display:flex;gap:7px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.filter-wrap::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-family:'Prompt',sans-serif;
  font-size:.76rem;font-weight:600;border:1.5px solid var(--border);
  background:#fff;color:var(--muted);cursor:pointer;transition:all .18s;white-space:nowrap;}
.chip.active{background:linear-gradient(135deg,var(--green-dark),var(--green));
  border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(24,161,90,.3);}
.chip:active{transform:scale(.95);}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);padding:12px 10px;text-align:center;}
.stat-num{font-size:1.5rem;font-weight:700;
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.stat-lbl{font-size:.64rem;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-top:3px;}

/* ── DATE GROUP ── */
.date-group{padding:0 16px 6px;}
.date-header{display:flex;align-items:center;gap:8px;padding:10px 0 8px;
  font-size:.72rem;font-weight:700;color:var(--green-dark);text-transform:uppercase;
  letter-spacing:.8px;position:sticky;top:72px;z-index:10;
  background:var(--bg);margin:0 -2px;padding-left:2px;}
.date-header::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.date-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.date-count{background:var(--green-soft);color:var(--green-dark);border:1px solid var(--border);
  padding:1px 8px;border-radius:10px;font-size:.68rem;font-weight:700;}

/* ── APPOINTMENT CARD ── */
.appt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
  transition:transform .15s,box-shadow .15s;position:relative;}
.appt-card:active{transform:scale(.985);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.appt-card.expanded .card-detail{display:block;}
.appt-card.expanded .card-chevron{transform:rotate(180deg);}

.card-accent{width:4px;position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;}

.card-main{display:flex;align-items:flex-start;gap:11px;padding:13px 14px 13px 18px;cursor:pointer;}
.card-avatar{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--green-dark),var(--green));}
.card-info{flex:1;min-width:0;}
.card-name{font-size:.92rem;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-bottom:3px;}
.card-sub{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.card-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;
  font-size:.69rem;font-weight:600;white-space:nowrap;}
.card-chevron{color:var(--muted);font-size:.75rem;flex-shrink:0;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);margin-top:3px;}

/* Detail section */
.card-detail{display:none;padding:0 14px 14px 18px;animation:slideDown .2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.detail-divider{height:1px;background:linear-gradient(to right,var(--border),transparent);margin-bottom:12px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.detail-item{background:var(--green-softer);border:1px solid var(--border);
  border-radius:var(--radius-xs);padding:8px 10px;}
.detail-label{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:3px;}
.detail-value{font-size:.82rem;font-weight:500;color:var(--text-2);word-break:break-word;}
.detail-item.full{grid-column:1/-1;}
.detail-tel a{color:var(--green);font-weight:600;text-decoration:none;}

/* Badges */
.badge-clinic{background:rgba(59,130,246,.1);color:#1d4ed8;border:1px solid rgba(59,130,246,.2);}
.badge-age{background:rgba(245,158,11,.1);color:#92400e;border:1px solid rgba(245,158,11,.2);}
.badge-today{background:rgba(239,68,68,.1);color:#991b1b;border:1px solid rgba(239,68,68,.2);}
.badge-soon{background:rgba(245,158,11,.1);color:#92400e;border:1px solid rgba(245,158,11,.2);}

/* ── LOADING / EMPTY ── */
.center-state{text-align:center;padding:50px 24px;}
.center-state i{font-size:3rem;color:rgba(24,161,90,.2);display:block;margin-bottom:14px;}
.center-state p{color:var(--muted);font-size:.88rem;margin:0;}

.loading-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.loading-dots span{width:10px;height:10px;border-radius:50%;background:var(--green);
  animation:bounce .8s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:.15s;}
.loading-dots span:nth-child(3){animation-delay:.30s;}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── SKELETON ── */
.skeleton{background:linear-gradient(90deg,#e8f5ee 25%,#d4eddf 50%,#e8f5ee 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── PULL TO REFRESH indicator ── */
.ptr-indicator{text-align:center;padding:12px;font-size:.78rem;color:var(--muted);
  display:none;align-items:center;justify-content:center;gap:6px;}

/* ── BOTTOM SPACE ── */
.bottom-space{height:calc(24px + env(safe-area-inset-bottom));}

/* ── UPDATED TIME ── */
.updated-bar{text-align:center;font-size:.7rem;color:var(--muted);padding:6px 16px 0;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.updated-bar i{font-size:.65rem;}

/* Toast */
.toast-msg{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:#1a2e25;color:#fff;
  padding:10px 20px;border-radius:20px;font-size:.82rem;font-family:'Prompt',sans-serif;
  box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:999;opacity:0;
  transition:all .25s;pointer-events:none;white-space:nowrap;}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(prefers-color-scheme:dark){
  :root{--bg:#0e1a14;--card:#162118;--border:rgba(24,161,90,.22);
        --text:#e8f5ee;--text-2:#a8c9b5;--muted:#5a8a6a;
        --green-softer:rgba(24,161,90,.08);}
  .search-box input,.chip{background:#162118;color:var(--text);}
  .stat-box,.appt-card,.detail-item{background:var(--card);}
  .date-header{background:var(--bg);}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title">
      <div class="topbar-icon"><i class="fa-solid fa-calendar-check"></i></div>
      <div class="topbar-text">
        <h1>ปฏิทินนัดหมาย</h1>
        <small id="hospitalName">กำลังโหลด...</small>
      </div>
    </div>
    <button class="topbar-refresh" id="refreshBtn" onclick="loadData(true)" title="รีเฟรช">
      <i class="fa-solid fa-rotate-right"></i>
    </button>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" id="searchInput" placeholder="ค้นหา ชื่อ, เลขบัตร, เบอร์โทร..." oninput="filterAndRender()">
    <span class="clear-btn" id="clearBtn" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></span>
  </div>
</div>

<!-- DATE RANGE BUTTONS -->
<div class="range-wrap" id="rangeWrap">
  <button class="range-btn" onclick="setRange('today',this)">วันนี้</button>
  <button class="range-btn" onclick="setRange('7day',this)">7 วัน</button>
  <button class="range-btn" onclick="setRange('month',this)">เดือนนี้</button>
  <button class="range-btn active" onclick="setRange('all',this)">ทั้งหมด</button>
</div>

<!-- FILTER CHIPS -->
<div class="filter-wrap" id="filterChips">
  <div class="chip active" data-clinic="all" onclick="setClinic('all',this)">
    <i class="fa-solid fa-list me-1"></i>ทั้งหมด
  </div>
</div>

<!-- UPDATED TIME -->
<div class="updated-bar" id="updatedBar" style="display:none;">
  <i class="fa-regular fa-clock"></i>
  <span id="updatedTime"></span>
</div>

<!-- STATS -->
<div class="stats-row" id="statsRow">
  <div class="stat-box"><div class="stat-num skeleton" style="height:28px;width:40px;margin:0 auto 4px;"></div><div class="stat-lbl skeleton" style="height:10px;width:50px;margin:0 auto;"></div></div>
  <div class="stat-box"><div class="stat-num skeleton" style="height:28px;width:40px;margin:0 auto 4px;"></div><div class="stat-lbl skeleton" style="height:10px;width:50px;margin:0 auto;"></div></div>
  <div class="stat-box"><div class="stat-num skeleton" style="height:28px;width:40px;margin:0 auto 4px;"></div><div class="stat-lbl skeleton" style="height:10px;width:50px;margin:0 auto;"></div></div>
</div>

<!-- CONTENT -->
<div id="content">
  <div class="center-state">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>
</div>

<div class="bottom-space"></div>

<!-- TOAST -->
<div class="toast-msg" id="toast"></div>

<script>
// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
var SHEET_ID   = '1MVWZyeqpTWVO4Sr2jb21YdVaAUQj_M-KaVPBXBH6W70';
var SHEET_NAME = 'นัดหมาย';
var GVZ_URL    = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
               + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME);

var allRows      = [];
var clinicColors = {};
var activeClinic = 'all';
var activeRange  = 'all';   // today | 7day | month | all

// ══════════════════════════════════════
//  RANGE FILTER
// ══════════════════════════════════════
function setRange(range, el) {
  activeRange = range;
  document.querySelectorAll('.range-btn').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  filterAndRender();
}

function inRange(dateStr) {
  if (activeRange === 'all') return true;
  var today = fmtDate(new Date());
  if (activeRange === 'today') return dateStr === today;
  if (activeRange === '7day') {
    var d7 = fmtDate(new Date(Date.now() + 6 * 86400000));
    return dateStr >= today && dateStr <= d7;
  }
  if (activeRange === 'month') {
    var now = new Date();
    var m1  = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-01';
    var m2  = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(new Date(now.getFullYear(), now.getMonth()+1, 0).getDate());
    return dateStr >= m1 && dateStr <= m2;
  }
  return true;
}
var COLORS = [
  '#18a15a','#3b82f6','#f59e0b','#8b5cf6',
  '#ef4444','#06b6d4','#ec4899','#10b981',
  '#f97316','#6366f1','#14b8a6','#a855f7'
];
var colorIdx = 0;

// ══════════════════════════════════════
//  FETCH DATA
// ══════════════════════════════════════
// ══════════════════════════════════════
//  FETCH DATA — ใช้ JSONP แทน fetch()
//  รองรับทั้ง file:// และ http://
// ══════════════════════════════════════
function loadData(showToastMsg) {
  var btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  // ลบ script tag เก่า (ถ้ามี)
  var old = document.getElementById('gviz_script');
  if (old) old.parentNode.removeChild(old);

  // JSONP callback name
  window.__gvizCallback = function(json) {
    try {
      parseGViz(json);
      btn.classList.remove('spinning');
      if (showToastMsg) showToast_('โหลดข้อมูลใหม่แล้ว ✓');
      var now = new Date();
      document.getElementById('updatedTime').textContent =
        'อัปเดต ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' น.';
      document.getElementById('updatedBar').style.display = 'flex';
    } catch(e) {
      btn.classList.remove('spinning');
      document.getElementById('content').innerHTML =
        '<div class="center-state"><i class="fa-solid fa-circle-exclamation"></i>'
        + '<p>แปลงข้อมูลไม่ได้<br><small>' + e.message + '</small></p></div>';
    }
  };

  var script = document.createElement('script');
  script.id  = 'gviz_script';
  script.onerror = function() {
    btn.classList.remove('spinning');
    document.getElementById('content').innerHTML =
      '<div class="center-state"><i class="fa-solid fa-circle-exclamation"></i>'
      + '<p>โหลดข้อมูลไม่ได้<br><small>ตรวจสอบการแชร์ Google Sheet</small></p></div>';
  };
  script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
             + '/gviz/tq?tqx=out:json;responseHandler:__gvizCallback'
             + '&sheet=' + encodeURIComponent(SHEET_NAME)
             + '&range=A2'          // ← ข้ามแถว 1 (meta) ให้ GViz ใช้แถว 2 เป็น header
             + '&t=' + Date.now();
  document.head.appendChild(script);
}

function parseGViz(json) {
  var cols = json.table.cols;
  var rows = json.table.rows;
  allRows  = [];
  clinicColors = {};
  colorIdx = 0;

  // หา header index จากชื่อ column
  var idx = {};
  cols.forEach(function(c,i){ if(c.label) idx[c.label.trim()] = i; });

  // Map columns
  var iDate   = firstIdx(idx, ['วันนัด','nextdate']);
  var iName   = firstIdx(idx, ['ชื่อ-สกุล','ชื่อสกุล','name']);
  var iAge    = firstIdx(idx, ['อายุ','age']);
  var iTel    = firstIdx(idx, ['เบอร์โทร','tel']);
  var iCid    = firstIdx(idx, ['เลขบัตร','cid']);
  var iClinic = firstIdx(idx, ['คลินิก','clinic']);
  var iAp     = firstIdx(idx, ['เหตุที่นัด','เหตุนัด','aptype']);
  var iNote   = firstIdx(idx, ['หมายเหตุ','note']);

  // ถ้าหา header ไม่เจอ → fallback ตาม index ของ Sheet
  // A=#, B=วันนัด, C=ชื่อ-สกุล, D=อายุ, E=เบอร์โทร, F=เลขบัตร, G=คลินิก, H=เหตุที่นัด, I=หมายเหตุ
  if (iDate   < 0) iDate   = 1;
  if (iName   < 0) iName   = 2;
  if (iAge    < 0) iAge    = 3;
  if (iTel    < 0) iTel    = 4;
  if (iCid    < 0) iCid    = 5;
  if (iClinic < 0) iClinic = 6;
  if (iAp     < 0) iAp     = 7;
  if (iNote   < 0) iNote   = 8;

  rows.forEach(function(row) {
    if (!row.c) return;
    var c   = row.c;
    var get = function(i){ return (i>=0 && c[i] && c[i].v !== null) ? c[i].v : ''; };

    var dateRaw = (iDate >= 0 && c[iDate]) ? c[iDate].v : null;
    var dateF   = (iDate >= 0 && c[iDate] && c[iDate].f) ? c[iDate].f : '';
    var dateStr = '';

    if (dateRaw instanceof Date) {
      // GViz ส่ง Date object มาตรง (พบบ่อยใน JSONP)
      dateStr = fmtDate(dateRaw);
    } else if (typeof dateRaw === 'string' && dateRaw.match(/^Date\((\d+),(\d+),(\d+)\)/)) {
      // GViz Date string format: "Date(2026,4,4)"
      var dm = dateRaw.match(/^Date\((\d+),(\d+),(\d+)\)/);
      dateStr = fmtDate(new Date(+dm[1], +dm[2], +dm[3]));
    } else if (typeof dateRaw === 'string' && dateRaw.match(/\d{4}-\d{2}-\d{2}/)) {
      dateStr = dateRaw.substring(0,10);
    } else if (dateF) {
      dateStr = parseDateStr(dateF);  // formatted string เช่น "4/5/2026" หรือ "04/05/2569"
    }
    if (!dateStr) return;

    var clinic = String(get(iClinic) || 'ไม่ระบุ');
    if (!clinicColors[clinic]) {
      clinicColors[clinic] = COLORS[colorIdx++ % COLORS.length];
    }

    allRows.push({
      date:   dateStr,
      name:   String(get(iName)   || ''),
      age:    String(get(iAge)    || ''),
      tel:    String(get(iTel)    || ''),
      cid:    String(get(iCid)    || ''),
      clinic: clinic,
      aptype: String(get(iAp)    || ''),
      note:   String(get(iNote)  || ''),
    });
  });

  allRows.sort(function(a,b){ return a.date.localeCompare(b.date); });
  document.getElementById('hospitalName').textContent = 'ระบบนัดหมาย';

  buildClinicChips();
  filterAndRender();
}

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function filterAndRender() {
  var q  = document.getElementById('searchInput').value.toLowerCase().trim();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';

  var filtered = allRows.filter(function(r) {
    if (!inRange(r.date)) return false;
    if (activeClinic !== 'all' && r.clinic !== activeClinic) return false;
    if (!q) return true;
    return r.name.toLowerCase().includes(q)
        || r.cid.includes(q)
        || r.tel.includes(q)
        || r.clinic.toLowerCase().includes(q)
        || r.aptype.toLowerCase().includes(q);
  });

  renderStats(filtered);
  renderCards(filtered);
}

function renderStats(rows) {
  var today = fmtDate(new Date());
  var todayCount = rows.filter(function(r){ return r.date === today; }).length;
  var clinics = {};
  rows.forEach(function(r){ clinics[r.clinic] = 1; });

  document.getElementById('statsRow').innerHTML =
    statBox(rows.length, 'ทั้งหมด') +
    statBox(todayCount,  'วันนี้') +
    statBox(Object.keys(clinics).length, 'คลินิก');
}

function statBox(n, label) {
  return '<div class="stat-box">'
    + '<div class="stat-num">' + n + '</div>'
    + '<div class="stat-lbl">' + label + '</div></div>';
}

function renderCards(rows) {
  var el = document.getElementById('content');
  if (!rows.length) {
    el.innerHTML = '<div class="center-state">'
      + '<i class="fa-solid fa-calendar-xmark"></i>'
      + '<p>ไม่พบข้อมูลนัดหมาย</p></div>';
    return;
  }

  var today = fmtDate(new Date());
  var tomorrow = fmtDate(new Date(Date.now() + 86400000));

  // จัดกลุ่มตามวัน
  var groups = {};
  var order  = [];
  rows.forEach(function(r) {
    if (!groups[r.date]) { groups[r.date] = []; order.push(r.date); }
    groups[r.date].push(r);
  });

  var html = '<div class="date-group">';
  order.forEach(function(date) {
    var g = groups[date];
    var label = thaiDateLabel(date, today, tomorrow);
    html += '<div class="date-header"><div class="date-dot"></div>'
          + label
          + '<span class="date-count">' + g.length + '</span></div>';

    g.forEach(function(r, i) {
      var color   = clinicColors[r.clinic] || '#18a15a';
      var initials = r.name.replace(/^(นาย|นาง|น\.ส\.|นางสาว|ด\.ช\.|ด\.ญ\.|เด็กชาย|เด็กหญิง)\s*/,'')
                           .split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2);
      var isToday = (date === today);

      html += '<div class="appt-card" id="card_'+date+'_'+i+'">'
        + '<div class="card-accent" style="background:'+color+';"></div>'
        + '<div class="card-main" onclick="toggle(\'card_'+date+'_'+i+'\')">'
        +   '<div class="card-avatar" style="background:linear-gradient(135deg,'+color+'cc,'+color+');">'
        +     (initials || '<i class="fa-solid fa-user" style="font-size:.75rem;"></i>')
        +   '</div>'
        +   '<div class="card-info">'
        +     '<div class="card-name">' + esc(r.name) + '</div>'
        +     '<div class="card-sub">'
        +       (r.clinic ? '<span class="card-badge badge-clinic" style="background:'+color+'18;border-color:'+color+'33;color:'+color+';">'
        +         '<i class="fa-solid fa-circle" style="font-size:.45rem;"></i>' + esc(r.clinic) + '</span>' : '')
        +       (r.age ? '<span class="card-badge badge-age">' + esc(r.age) + ' ปี</span>' : '')
        +       (isToday ? '<span class="card-badge badge-today"><i class="fa-solid fa-star" style="font-size:.55rem;"></i>วันนี้</span>' : '')
        +     '</div>'
        +   '</div>'
        +   '<div class="card-chevron"><i class="fa-solid fa-chevron-down"></i></div>'
        + '</div>'
        + '<div class="card-detail">'
        +   '<div class="detail-divider"></div>'
        +   '<div class="detail-grid">'
        +     (r.cid    ? detailItem('เลขบัตร', '<span style="font-family:monospace;font-size:.79rem;">'+esc(r.cid)+'</span>') : '')
        +     (r.tel    ? detailItem('เบอร์โทร', '<a href="tel:'+esc(r.tel)+'">📞 '+esc(r.tel)+'</a>', 'detail-tel') : '')
        +     (r.aptype ? detailItem('เหตุที่นัด', esc(r.aptype)) : '')
        +     (r.note   ? detailItem('หมายเหตุ', esc(r.note), r.note.length > 30 ? 'full' : '') : '')
        +   '</div>'
        + '</div>'
        + '</div>';
    });
  });
  html += '</div>';
  el.innerHTML = html;
}

function detailItem(label, val, extra) {
  return '<div class="detail-item ' + (extra||'') + '">'
    + '<div class="detail-label">' + label + '</div>'
    + '<div class="detail-value">' + val + '</div>'
    + '</div>';
}

// ══════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════
function toggle(id) {
  var card = document.getElementById(id);
  if (!card) return;
  card.classList.toggle('expanded');
}

function buildClinicChips() {
  var clinics = {};
  allRows.forEach(function(r){ clinics[r.clinic] = (clinics[r.clinic]||0)+1; });
  var sorted = Object.keys(clinics).sort(function(a,b){ return clinics[b]-clinics[a]; });

  var html = '<div class="chip active" data-clinic="all" onclick="setClinic(\'all\',this)">'
           + '<i class="fa-solid fa-list" style="margin-right:4px;"></i>ทั้งหมด</div>';
  sorted.forEach(function(cl) {
    var color = clinicColors[cl] || '#18a15a';
    html += '<div class="chip" data-clinic="' + esc(cl) + '" onclick="setClinic(\'' + escQ(cl) + '\',this)"'
          + ' style="--chip-c:' + color + ';">'
          + '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+color+';margin-right:4px;vertical-align:middle;"></span>'
          + esc(cl) + ' <span style="opacity:.7;">(' + clinics[cl] + ')</span>'
          + '</div>';
  });

  document.getElementById('filterChips').innerHTML = html;
}

function setClinic(cl, el) {
  activeClinic = cl;
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  filterAndRender();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  filterAndRender();
}

// ══════════════════════════════════════
//  DATE HELPERS
// ══════════════════════════════════════
var THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                         'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var THAI_DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];

function fmtDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function parseDateStr(s) {
  if (!s) return '';
  // dd/mm/yyyy or d/m/yyyy
  var m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) {
    var y = parseInt(m[3]); if (y > 2500) y -= 543;
    return y + '-' + pad(parseInt(m[2])) + '-' + pad(parseInt(m[1]));
  }
  // yyyy-mm-dd
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return s.substring(0,10);
  return '';
}

function thaiDateLabel(dateStr, today, tomorrow) {
  var parts = dateStr.split('-');
  var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  var dayName = THAI_DAYS[d.getDay()];
  var dateNum = d.getDate();
  var monthName = THAI_MONTHS_SHORT[d.getMonth()];
  var year = d.getFullYear() + 543;
  var label = dayName + ' ' + dateNum + ' ' + monthName + ' ' + year;
  if (dateStr === today)    return '🔴 วันนี้ — ' + label;
  if (dateStr === tomorrow) return '🟡 พรุ่งนี้ — ' + label;
  return label;
}

function pad(n){ return n < 10 ? '0'+n : String(n); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escQ(s){ return s.replace(/'/g,"\\'"); }

function firstIdx(obj, names) {
  for (var i=0; i<names.length; i++) { if (obj[names[i]] !== undefined) return obj[names[i]]; }
  return -1;
}

function showToast_(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ══════════════════════════════════════
loadData(false);

// Auto-refresh ทุก 5 นาที
setInterval(function(){ loadData(false); }, 300000);
</script>
