<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสอบถามความต้องการถ่ายโอนภารกิจ รพ.สต.</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f7c6f 0%, #2d9687 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .header p {
            font-size: 16px;
            font-weight: 300;
            opacity: 0.95;
        }

        .form-content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 35px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f7c6f;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #11998e;
        }

        .question {
            margin-bottom: 25px;
        }

        .question-label {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Sarabun', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-item:hover {
            border-color: #11998e;
            background: #f0faf9;
        }

        .radio-item input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            margin-top: 3px;
            cursor: pointer;
            accent-color: #11998e;
            flex-shrink: 0;
        }

        .radio-item label {
            margin: 0;
            cursor: pointer;
            flex: 1;
            font-weight: 500;
        }

        .sub-input {
            margin-top: 10px;
            margin-left: 32px;
            display: none;
        }

        .sub-input.active {
            display: block;
        }

        .position-list {
            margin-top: 15px;
            margin-left: 32px;
            display: none;
        }

        .position-list.active {
            display: block;
        }

        .position-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .position-item span {
            min-width: 40px;
            font-weight: 600;
            color: #0f7c6f;
        }

        .position-item input {
            flex: 1;
        }

        .inline-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .inline-input {
            max-width: 150px;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .hidden {
            display: none !important;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .submit-section {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .submit-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
            font-family: 'Sarabun', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }

            .form-content {
                padding: 25px 20px;
            }

            .section {
                padding: 20px 15px;
            }

            .inline-group {
                flex-direction: column;
                align-items: stretch;
            }

            .inline-input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 แบบสอบถามความต้องการถ่ายโอนภารกิจ<br>โรงพยาบาลส่งเสริมสุขภาพตำบล (รพ.สต.)</h1>
            <p>ให้แก่องค์การบริหารส่วนจังหวัดสุรินทร์</p>
        </div>

        <div class="form-content">
            <div id="message" class="message"></div>

            <form id="surveyForm">
                <!-- คำถามที่ 1 -->
                <div class="section">
                    <div class="question">
                        <label class="question-label">
                            ๑. โรงพยาบาลส่งเสริมสุขภาพตำบลของท่าน มีความประสงค์ต้องการถ่ายโอนภารกิจโรงพยาบาลส่งเสริมสุขภาพตำบล (รพ.สต.) ให้แก่องค์การบริหารส่วนจังหวัดสุรินทร์ <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="q1_yes" name="q1" value="ต้องการถ่ายโอน รพ.สต." required>
                                <label for="q1_yes">ต้องการถ่ายโอน รพ.สต.</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="q1_no" name="q1" value="ไม่ต้องการถ่ายโอน" required>
                                <label for="q1_no">
                                    ไม่ต้องการถ่ายโอน รพ.สต.
                                    <div class="sub-input" id="q1_no_reason">
                                        <label style="font-size: 14px; margin-top: 10px;">เหตุผลเนื่องจาก:</label>
                                        <textarea id="q1_no_reason_text" placeholder="กรุณาระบุเหตุผล..."></textarea>
                                    </div>
                                </label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="q1_unsure" name="q1" value="ไม่แน่ใจ" required>
                                <label for="q1_unsure">
                                    ไม่แน่ใจ
                                    <div class="sub-input" id="q1_unsure_reason">
                                        <label style="font-size: 14px; margin-top: 10px;">ระบุเหตุผล:</label>
                                        <textarea id="q1_unsure_reason_text" placeholder="กรุณาระบุเหตุผล..."></textarea>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- คำถามที่ 2 -->
                <div class="section" id="section_q2">
                    <div class="question">
                        <label class="question-label">
                            ๒. กรณีที่มีความประสงค์ถ่ายโอนภารกิจโรงพยาบาลส่งเสริมสุขภาพตำบล (รพ.สต.) ให้แก่องค์การบริหารส่วนจังหวัดสุรินทร์ <span class="required">*</span>
                        </label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="q2_all" name="q2" value="โอนทั้งหมดทุกคน">
                                <label for="q2_all">โอนทั้งหมดทุกคน</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="q2_partial" name="q2" value="โอนเป็นบางส่วน">
                                <label for="q2_partial">
                                    โอนเป็นบางส่วน
                                    <div class="sub-input" id="q2_partial_detail">
                                        <div class="inline-group" style="margin-top: 10px; margin-bottom: 15px;">
                                            <label>จำนวน:</label>
                                            <input type="number" id="q2_partial_count" class="inline-input" placeholder="0" min="0" max="10">
                                            <label>คน</label>
                                        </div>
                                        <label style="font-size: 14px; margin-bottom: 10px;">ตำแหน่งที่ประสงค์ถ่ายโอน คือ:</label>
                                        <div class="position-list">
                                            <div class="position-item">
                                                <span>1.</span>
                                                <input type="text" id="position_1" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>2.</span>
                                                <input type="text" id="position_2" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>3.</span>
                                                <input type="text" id="position_3" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>4.</span>
                                                <input type="text" id="position_4" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>5.</span>
                                                <input type="text" id="position_5" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>6.</span>
                                                <input type="text" id="position_6" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>7.</span>
                                                <input type="text" id="position_7" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>8.</span>
                                                <input type="text" id="position_8" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>9.</span>
                                                <input type="text" id="position_9" placeholder="ระบุตำแหน่ง">
                                            </div>
                                            <div class="position-item">
                                                <span>10.</span>
                                                <input type="text" id="position_10" placeholder="ระบุตำแหน่ง">
                                            </div>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลทั่วไป -->
                <div class="section">
                    <div class="section-title">ข้อมูลทั่วไป</div>

                    <div class="form-group">
                        <label>1. ชื่อโรงพยาบาลส่งเสริมสุขภาพตำบล <span class="required">*</span></label>
                        <input type="text" id="hospital_name" name="hospital_name" required placeholder="ระบุชื่อ รพ.สต.">
                    </div>

                    <div class="form-group">
                        <label>2. ที่อยู่ <span class="required">*</span></label>
                        <textarea id="address" name="address" required placeholder="ระบุที่อยู่"></textarea>
                    </div>

                    <div class="form-group">
                        <label>3. เบอร์โทร <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" required placeholder="เช่น 044-123456">
                    </div>

                    <div class="form-group">
                        <div class="inline-group">
                            <label>4. หมู่บ้านในเขตพื้นที่รับผิดชอบ <span class="required">*</span></label>
                            <input type="number" id="villages" name="villages" class="inline-input" required min="0" placeholder="0">
                            <label>หมู่บ้าน</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="inline-group">
                            <label>5. ประชากรในเขตพื้นที่รับผิดชอบ <span class="required">*</span></label>
                            <input type="number" id="population" name="population" class="inline-input" required min="0" placeholder="0">
                            <label>คน (ตามทะเบียนราษฎร)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="inline-group">
                            <label>6. อาสาสมัครสาธารณสุขประจำหมู่บ้าน <span class="required">*</span></label>
                            <input type="number" id="volunteers" name="volunteers" class="inline-input" required min="0" placeholder="0">
                            <label>คน</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>7. การขึ้นทะเบียนเป็นหน่วยบริการปฐมภูมิ <span class="required">*</span></label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="reg_done" name="registration" value="ขึ้นทะเบียนแล้ว" required>
                                <label for="reg_done">ขึ้นทะเบียนแล้ว</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="reg_not" name="registration" value="ยังไม่ได้ขึ้นทะเบียน" required>
                                <label for="reg_not">ยังไม่ได้ขึ้นทะเบียน</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="reg_inprogress" name="registration" value="อยู่ระหว่างดำเนินการ" required>
                                <label for="reg_inprogress">อยู่ระหว่างดำเนินการ</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>8. บุคลากรประจำโรงพยาบาลส่งเสริมสุขภาพตำบล <span class="required">*</span></label>
                        
                        <div class="inline-group" style="margin-bottom: 10px;">
                            <label style="min-width: 200px;">รวมทั้งหมด:</label>
                            <input type="number" id="staff_total" class="inline-input" required min="0" placeholder="0">
                            <label>คน</label>
                        </div>

                        <div style="margin-left: 20px; margin-top: 15px;">
                            <div class="inline-group" style="margin-bottom: 10px;">
                                <label style="min-width: 180px;">ข้าราชการ:</label>
                                <input type="number" id="staff_government" class="inline-input" required min="0" placeholder="0">
                                <label>คน</label>
                            </div>

                            <div class="inline-group" style="margin-bottom: 10px;">
                                <label style="min-width: 180px;">พกส. (พนักงานกระทรวงสาธารณสุข):</label>
                                <input type="number" id="staff_pkgs" class="inline-input" required min="0" placeholder="0">
                                <label>คน</label>
                            </div>

                            <div class="inline-group">
                                <label style="min-width: 180px;">พนักงานจ้างอื่นๆ:</label>
                                <input type="number" id="staff_other" class="inline-input" required min="0" placeholder="0">
                                <label>คน</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <div class="submit-section">
                    <button type="submit" class="submit-btn" id="submitBtn">
                        ส่งแบบสอบถาม
                    </button>
                </div>
            </form>
        </div>

        <div class="footer">
            <p>© 2025 แบบสอบถามความต้องการถ่ายโอนภารกิจ รพ.สต. | ข้อมูลของท่านจะถูกเก็บเป็นความลับ</p>
        </div>
    </div>

    <script>
        // แสดง/ซ่อนช่องกรอกเหตุผลในคำถามที่ 1
        document.querySelectorAll('input[name="q1"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // ซ่อนทั้งหมดก่อน
                document.getElementById('q1_no_reason').classList.remove('active');
                document.getElementById('q1_unsure_reason').classList.remove('active');
                
                // แสดงเฉพาะที่เลือก
                if (this.id === 'q1_no') {
                    document.getElementById('q1_no_reason').classList.add('active');
                } else if (this.id === 'q1_unsure') {
                    document.getElementById('q1_unsure_reason').classList.add('active');
                }

                // แสดง/ซ่อนคำถามที่ 2
                const section_q2 = document.getElementById('section_q2');
                if (this.id === 'q1_yes') {
                    section_q2.style.display = 'block';
                    // เพิ่ม required
                    document.querySelectorAll('#section_q2 input[name="q2"]').forEach(r => {
                        r.setAttribute('required', 'required');
                    });
                } else {
                    section_q2.style.display = 'none';
                    // ลบ required
                    document.querySelectorAll('#section_q2 input[name="q2"]').forEach(r => {
                        r.removeAttribute('required');
                        r.checked = false;
                    });
                    // ซ่อนส่วนย่อย
                    document.getElementById('q2_partial_detail').classList.remove('active');
                }
            });
        });

        // แสดง/ซ่อนรายละเอียดในคำถามที่ 2
        document.querySelectorAll('input[name="q2"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const detail = document.getElementById('q2_partial_detail');
                const positionList = detail.querySelector('.position-list');
                
                if (this.id === 'q2_partial') {
                    detail.classList.add('active');
                    positionList.classList.add('active');
                } else {
                    detail.classList.remove('active');
                    positionList.classList.remove('active');
                    // ล้างค่า
                    document.getElementById('q2_partial_count').value = '';
                    for (let i = 1; i <= 10; i++) {
                        document.getElementById('position_' + i).value = '';
                    }
                }
            });
        });

        // จัดการส่งฟอร์ม
        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            // รวบรวมข้อมูล
            const q1_value = document.querySelector('input[name="q1"]:checked').value;
            let q1_reason = '';
            if (q1_value === 'ไม่ต้องการถ่ายโอน') {
                q1_reason = document.getElementById('q1_no_reason_text').value;
            } else if (q1_value === 'ไม่แน่ใจ') {
                q1_reason = document.getElementById('q1_unsure_reason_text').value;
            }

            let q2_value = '';
            let q2_count = '';
            let positions = [];
            
            if (q1_value === 'ต้องการถ่ายโอน รพ.สต.') {
                q2_value = document.querySelector('input[name="q2"]:checked').value;
                if (q2_value === 'โอนเป็นบางส่วน') {
                    q2_count = document.getElementById('q2_partial_count').value;
                    for (let i = 1; i <= 10; i++) {
                        const pos = document.getElementById('position_' + i).value;
                        if (pos.trim() !== '') {
                            positions.push(pos);
                        }
                    }
                }
            }

            const formData = {
                timestamp: new Date().toLocaleString('th-TH'),
                q1: q1_value,
                q1_reason: q1_reason,
                q2: q2_value,
                q2_count: q2_count,
                positions: positions.join(' | '),
                hospital_name: document.getElementById('hospital_name').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                villages: document.getElementById('villages').value,
                population: document.getElementById('population').value,
                volunteers: document.getElementById('volunteers').value,
                registration: document.querySelector('input[name="registration"]:checked').value,
                staff_total: document.getElementById('staff_total').value,
                staff_government: document.getElementById('staff_government').value,
                staff_pkgs: document.getElementById('staff_pkgs').value,
                staff_other: document.getElementById('staff_other').value
            };

            // ปิดการใช้งานปุ่มชั่วคราว
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งข้อมูล...';

            // ส่งข้อมูลไปยัง Google Apps Script
            const scriptURL = 'https://script.google.com/macros/s/AKfycby7YXQZXTiWIGuK2umQGL8Dg-w1n9w723bHfCfFlspUQabCnuY_Jmxn1fFQrYvWXdZm/exec'; // ใส่ URL ของ Web App ที่นี่

            fetch(scriptURL, {
                redirect: "follow",
                method: 'POST',
                body: JSON.stringify(formData),
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                }
            })
            .then(response => response.text())
            .then(text => {
                console.log('Response:', text);
                try {
                    const data = JSON.parse(text);
                    if (data.status === 'success') {
                        messageDiv.className = 'message success';
                        messageDiv.textContent = '✅ ส่งข้อมูลสำเร็จ ขอบคุณที่ให้ความร่วมมือในการตอบแบบสอบถาม';
                        messageDiv.style.display = 'block';
                        
                        // รีเซ็ตฟอร์ม
                        document.getElementById('surveyForm').reset();
                        document.getElementById('q1_no_reason').classList.remove('active');
                        document.getElementById('q1_unsure_reason').classList.remove('active');
                        document.getElementById('section_q2').style.display = 'none';
                        
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        throw new Error(data.message || 'เกิดข้อผิดพลาด');
                    }
                } catch (parseError) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ ส่งข้อมูลสำเร็จ ขอบคุณที่ให้ความร่วมมือในการตอบแบบสอบถาม';
                    messageDiv.style.display = 'block';
                    
                    document.getElementById('surveyForm').reset();
                    document.getElementById('q1_no_reason').classList.remove('active');
                    document.getElementById('q1_unsure_reason').classList.remove('active');
                    document.getElementById('section_q2').style.display = 'none';
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ เกิดข้อผิดพลาด: ' + error.message;
                messageDiv.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งแบบสอบถาม';
                
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            });
        });
    </script>
</body>
</html>
